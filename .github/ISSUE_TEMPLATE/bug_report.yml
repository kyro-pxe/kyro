name: Bug report
description: Report something that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Kyro is in early development. Please check the README for what is
        actually implemented before filing a bug.
        Do not report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `kyro ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kyro version
      description: Output of `kyro version`, or the commit hash you built from.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and architecture of the machine running Kyro.
      placeholder: e.g. Debian 13, amd64
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network and client details
      description: >
        If relevant: existing DHCP server, client hardware or hypervisor, and
        firmware mode (UEFI or BIOS).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove anything sensitive first.
      render: text
    validations:
      required: false
