name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check the shell scripts
        run: |
          shellcheck -s sh deploy/install.sh scripts/release/build.sh \
            scripts/test-installer/inside.sh scripts/test-installer/inside-systemd.sh
          shellcheck scripts/e2e/run.sh scripts/test-installer/run.sh

      - name: Build the release files
        run: |
          ./scripts/release/build.sh v0.0.0-ci
          (cd dist && sha256sum --check SHA256SUMS)
