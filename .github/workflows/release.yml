name: Release

# Builds the release files for a tag and attaches them to a DRAFT release.
# Nothing is published until a maintainer publishes the draft by hand.
#
# Started by hand (Actions > Release > Run workflow) it is a dry run: it
# builds the files and keeps them as a workflow artifact, and creates no
# release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the dry-run build, e.g. v0.1.0-alpha"
        required: true
        default: v0.0.0-dryrun

permissions:
  contents: write

jobs:
  release:
    name: Build the release files
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: ./scripts/release/build.sh "$VERSION"

      - name: Check the checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Keep the files of a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error

      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag \
            --title "Kyro $GITHUB_REF_NAME" \
            --notes "Alpha. See docs/ROADMAP.md for what works and README.md for known limitations." \
            dist/kyro_*_linux_amd64.tar.gz dist/install.sh dist/SHA256SUMS
