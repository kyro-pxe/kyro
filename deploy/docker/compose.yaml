# Kyro with Docker Compose. Read README.md next to this file first.
#
# Host networking is required: a booting client finds Kyro by broadcast, and
# broadcasts do not reach a container on Docker's bridge network.

services:
  kyro:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: kyro:local
    restart: unless-stopped
    network_mode: host

    # Root inside the container, with every capability dropped except the
    # one that allows listening on ports below 1024 (67, 69, 80, 445).
    # Docker cannot hand a capability to a non-root user without file
    # capabilities, which no-new-privileges switches off.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true

    volumes:
      - ./config.yaml:/etc/kyro/config.yaml:ro
      - ./data:/var/lib/kyro
      # Your Windows ISOs, read-only. Add them with:
      #   docker compose run --rm kyro image add /isos/NAME.iso --name win11 --link
      - ./isos:/isos:ro
